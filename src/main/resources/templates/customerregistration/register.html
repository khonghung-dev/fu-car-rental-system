<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản - FU Car Renting</title>
</head>
<body>
<main>
    <h1>Đăng ký tài khoản</h1>
    <form th:action="@{/register}" th:object="${registrationForm}" method="post">
        <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert"></p>
        <p>
            <label for="accountName">Tên tài khoản</label>
            <input type="text" id="accountName" th:field="*{accountName}"
                   required maxlength="100" autocomplete="username">
            <span th:if="${#fields.hasErrors('accountName')}" th:errors="*{accountName}" role="alert"></span>
        </p>
        <p>
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}"
                   required maxlength="200" autocomplete="email">
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"></span>
        </p>
        <p>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                   aria-describedby="passwordPolicy">
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></span>
            <span th:if="${#fields.hasErrors('passwordLongEnough')}" th:errors="*{passwordLongEnough}" role="alert"></span>
            <span th:if="${#fields.hasErrors('passwordWithinBcryptLimit')}" th:errors="*{passwordWithinBcryptLimit}" role="alert"></span>
            <span th:if="${#fields.hasErrors('passwordWithoutBoundaryWhitespace')}" th:errors="*{passwordWithoutBoundaryWhitespace}" role="alert"></span>
        </p>
        <p id="passwordPolicy">Mật khẩu phải có ít nhất 8 ký tự, gồm chữ hoa, chữ thường, chữ số và ký tự đặc biệt;
            không có khoảng trắng ở đầu hoặc cuối và không vượt quá 72 byte UTF-8.</p>
        <p>
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" role="alert"></span>
            <span th:if="${#fields.hasErrors('passwordsMatching')}" th:errors="*{passwordsMatching}" role="alert"></span>
        </p>
        <button type="submit">Đăng ký</button>
    </form>
    <p><a th:href="@{/login}">Đăng nhập</a></p>
</main>
</body>
</html>
