<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${customerId == null ? 'Tạo khách hàng - FU Car Renting' : 'Chỉnh sửa khách hàng - FU Car Renting'}"></title>
</head>
<body>
<main>
    <h1 th:text="${customerId == null ? 'Tạo khách hàng' : 'Chỉnh sửa khách hàng'}"></h1>
    <p th:if="${customerId != null}">Mã khách hàng: <span th:text="${customerId}"></span></p>
    <form th:action="${customerId == null} ? @{/admin/customers} : @{/admin/customers/{id}/edit(id=${customerId})}"
          th:object="${customerForm}" method="post">
        <p th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}" role="alert"></p>
        <p>
            <label for="fullName">Họ tên</label>
            <input type="text" id="fullName" th:field="*{fullName}" required maxlength="200">
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" role="alert"></span>
        </p>
        <p>
            <label for="mobile">Số điện thoại</label>
            <input type="tel" id="mobile" th:field="*{mobile}" required maxlength="15">
            <span th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" role="alert"></span>
        </p>
        <p>
            <label for="birthday">Ngày sinh</label>
            <input type="date" id="birthday" th:field="*{birthday}" required>
            <span th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}" role="alert"></span>
        </p>
        <p>
            <label for="identityCard">Số giấy tờ tùy thân</label>
            <input type="text" id="identityCard" th:field="*{identityCard}" required maxlength="20">
            <span th:if="${#fields.hasErrors('identityCard')}" th:errors="*{identityCard}" role="alert"></span>
        </p>
        <p>
            <label for="licenceNumber">Số giấy phép lái xe</label>
            <input type="text" id="licenceNumber" th:field="*{licenceNumber}" required maxlength="20">
            <span th:if="${#fields.hasErrors('licenceNumber')}" th:errors="*{licenceNumber}" role="alert"></span>
        </p>
        <p>
            <label for="licenceDate">Ngày cấp giấy phép</label>
            <input type="date" id="licenceDate" th:field="*{licenceDate}" required>
            <span th:if="${#fields.hasErrors('licenceDate')}" th:errors="*{licenceDate}" role="alert"></span>
        </p>
        <p>
            <label for="accountId">Mã tài khoản hiện có</label>
            <input type="number" id="accountId" th:field="*{accountId}" required step="1">
            <span th:if="${#fields.hasErrors('accountId')}" th:errors="*{accountId}" role="alert"></span>
        </p>
        <button type="submit">Lưu khách hàng</button>
    </form>
    <p><a th:href="@{/admin/customers}">Danh sách khách hàng</a></p>
</main>
</body>
</html>
